name: Verify

on:
  push:
    branches: [master]
    tags: ['**']
  pull_request:

permissions:
  contents: read

env:
  VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0-SNAPSHOT' }}

jobs:
  android:
    name: Android and Go tests (Ubuntu x64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.1'
          cache-dependency-path: |
            go/mwebdandroid/go.sum
            go/mwebdandroid/third_party/mwebd/go.sum
            go/mwebdandroid/third_party/neutrino/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test Go modules
        shell: bash
        run: |
          (cd go/mwebdandroid && go test ./...)
          (cd go/mwebdandroid/third_party/mwebd && go test ./...)
          (cd go/mwebdandroid/third_party/neutrino && go test ./...)
      - name: Test Android API and native runtime
        run: ./gradlew :mwebd-kmp:testReleaseUnitTest :native-android:verifyElfAlignment

  desktop:
    name: Desktop tests (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-22.04
          - platform: windows-x64
            runner: windows-2025
          - platform: macos-arm64
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.1'
          cache-dependency-path: go/mwebdandroid/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify runner architecture
        shell: bash
        env:
          SIDECAR_PLATFORM: ${{ matrix.platform }}
        run: |
          case "${SIDECAR_PLATFORM}" in
            linux-x64) [[ "$(uname -m)" == x86_64 ]] ;;
            windows-x64) [[ "$(go env GOARCH)" == amd64 ]] ;;
            macos-arm64) [[ "$(uname -m)" == arm64 ]] ;;
          esac
      - name: Test desktop transport
        shell: bash
        run: ./gradlew :transport-jvm:test :mwebd-kmp:desktopTest
      - name: Locate sidecar
        id: sidecar
        shell: bash
        env:
          SIDECAR_PLATFORM: ${{ matrix.platform }}
        run: |
          source scripts/sidecar-assets.sh
          filename="$(sidecar_filename "${SIDECAR_PLATFORM}")"
          path="transport-jvm/build/generated/sidecarResources/mwebd/${SIDECAR_PLATFORM}/${filename}"
          go version -m "${path}" | grep -F "GOOS=$(sidecar_goos "${SIDECAR_PLATFORM}")"
          go version -m "${path}" | grep -F "GOARCH=$(sidecar_goarch "${SIDECAR_PLATFORM}")"
          if [[ "${SIDECAR_PLATFORM}" == macos-arm64 ]]; then
            [[ "$(otool -l "${path}" | awk '$1 == "minos" { print $2; exit }')" == 13.0 ]]
          fi
          echo "path=${path}" >> "${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@v4
        with:
          name: sidecar-${{ matrix.platform }}
          path: ${{ steps.sidecar.outputs.path }}
          if-no-files-found: error

  release:
    name: Publish sidecar release assets
    if: github.ref_type == 'tag'
    needs: [android, desktop]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: sidecar-*
          path: release
          merge-multiple: true
      - name: Create release manifest
        shell: bash
        run: scripts/create-sidecar-manifest.sh "${GITHUB_REF_NAME}" "${GITHUB_SHA}" release release/mwebd-sidecars.manifest
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/* --verify-tag --title "${GITHUB_REF_NAME}" --generate-notes
